<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">

<title>BarberShop 3D Walkthrough</title>
<style>
:root{--pn:rgba(255,255,255,.88);--fg:#1c2127;--mu:#5c6670;--ac:#b8741a;--bd:rgba(0,0,0,.12)}

:root[data-theme="dark"]{--pn:rgba(20,24,29,.86);--fg:#eef1f4;--mu:#9aa5b0;--ac:#e8b04a;--bd:rgba(255,255,255,.14)}
html,body{margin:0;height:100%;overflow:hidden;background:#d5e6f3;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}

.card{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;backdrop-filter:blur(8px)}
#ttl b{display:block;font-size:15px}#ttl span{font-size:12px;color:var(--mu)}
#vn{font-size:14px;font-weight:600;color:var(--ac);align-self:flex-start}

#bar button.on{background:var(--ac);color:#fff;border-color:transparent}
#note{position:fixed;left:12px;bottom:calc(60px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--mu);background:var(--pn);border-radius:8px;padding:4px 8px;pointer-events:none}

<script>
const T=THREE,UP=new T.Vector3(0,1,0);

 const s=new T.Mesh(new T.BoxGeometry(.12,.04,1.5),new T.MeshBasicMaterial({color:0xffffff}));s.position.set(p[0],2.77,p[1]);S.add(s)});

function floorTex(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
 g.fillStyle='#a9abb0';g.fillRect(0,0,128,128);g.strokeStyle='#c4c6cb';g.lineWidth=5;g.beginPath();g.moveTo(64,6);g.lineTo(122,64);g.lineTo(64,122);g.lineTo(6,64);g.closePath();g.stroke();
 g.strokeStyle='#8c8e94';g.lineWidth=2;g.strokeRect(0,0,128,128);
 const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(16,11);t.anisotropy=8;t.encoding=T.sRGBEncoding;return t}

const DK=0x20262c;
for(let i=0;i<=10;i++){const x=-4+i*.8;if(x>-.25&&x<.85)continue;bx(x,2.7,.07,.07,2.8,DK,0,0,false)}
bx(-.2,2.7,.08,.08,2.1,DK);bx(.8,2.7,.08,.08,2.1,DK);bx(.3,2.7,1,.08,.08,DK,2.1);bx(.62,2.66,.04,.04,.35,0xcfd3d6,.75,{metalness:.9});
[.7,1.4,2.1].forEach(y=>{bx(-2.2,2.7,3.6,.05,.05,DK,y,0,false);bx(2.4,2.7,3.2,.05,.05,DK,y,0,false)});

function chair(x,z){const g=new T.Group();g.position.set(x,0,z);g.rotation.y=Math.PI;S.add(g);
 const L=M(0x2b2626,{roughness:.45}),Cr=M(0xd0d4d7,{metalness:.9,roughness:.25});
 const a=(geo,m,px,py,pz)=>{const k=new T.Mesh(geo,m);k.position.set(px,py,pz);k.castShadow=k.receiveShadow=true;g.add(k);return k};
 a(new T.CylinderGeometry(.3,.34,.06,24),Cr,0,.03,0);a(new T.CylinderGeometry(.07,.09,.38,16),Cr,0,.25,0);
 a(new T.BoxGeometry(.62,.14,.58),L,0,.5,.03);a(new T.BoxGeometry(.56,.78,.13),L,0,.97,-.3).rotation.x=-.08;a(new T.BoxGeometry(.3,.2,.12),L,0,1.45,-.33);
 [-1,1].forEach(s=>{a(new T.BoxGeometry(.08,.07,.5),M(0x6b4a33),s*.36,.72,.03);a(new T.BoxGeometry(.05,.22,.05),Cr,s*.36,.6,.2)});
 a(new T.BoxGeometry(.5,.05,.28),Cr,0,.22,.55)}
function station(x){
 bx(x,-2.45,2,.5,.85,0x4a3b30);bx(x,-2.45,2.06,.56,.04,0xd8d2c6,.85);
 bx(x,-2.67,1.16,.04,1.1,0x24211f,.95);
 const mm=M(0xe8f0f5,{metalness:.95,roughness:.05});
 const m1=new T.Mesh(new T.BoxGeometry(1,1.1,.02),mm);m1.position.set(x,1.5,-2.64);S.add(m1);
 const fr=new T.Mesh(new T.CylinderGeometry(.58,.58,.04,28),M(0x24211f));fr.rotation.x=Math.PI/2;fr.position.set(x,2.05,-2.67);S.add(fr);
 const m2=new T.Mesh(new T.CylinderGeometry(.5,.5,.02,28),mm);m2.rotation.x=Math.PI/2;m2.position.set(x,2.05,-2.64);S.add(m2);
 [-.72,.72].forEach(s=>{const b=new T.Mesh(new T.SphereGeometry(.06,12,10),new T.MeshBasicMaterial({color:0xfff2c8}));b.position.set(x+s,2.0,-2.6);S.add(b)});
 [[-.6,0xc0392b],[-.35,0x2e86c1],[.5,0xf1c40f],[.7,0xffffff]].forEach(b=>{const c=new T.Mesh(new T.CylinderGeometry(.05,.05,.18,12),M(b[1]));c.position.set(x+b[0],.97,-2.5);c.castShadow=true;S.add(c)});
 chair(x,-1.75)}
[-2.44,-.5,1.48].forEach(station);
// perabot lain
bx(-1.87,.95,.36,.36,1.1,0xd62020);                      // kabinet merah
bx(-1.2,1.4,.42,.5,.9,0x1020e0);                          // kabinet biru
bx(-.75,1.77,.3,1.2,1.9,0xe9ecee,0,{transparent:true,opacity:.55});
[.4,.85,1.3,1.75].forEach(y=>bx(-.75,1.77,.32,1.18,.03,0x9aa0a6,y));
bx(3.75,1,.3,.4,.5,0x9a5a2e);                             // rak cokelat
// sofa
bx(2.55,2.3,2.1,.7,.45,0x2b2b2e);bx(2.55,2.62,2.1,.18,.5,0x2b2b2e,.45);bx(1.53,2.3,.16,.7,.7,0x2b2b2e);bx(3.57,2.3,.16,.7,.7,0x2b2b2e);
bx(3.05,2.18,.4,.12,.4,0x0a93bd,.5).rotation.y=.7;
bx(2.55,1.5,1.1,.6,.04,0x6b4a33,.35);                      // meja kecil
// keramas
bx(2.85,-.1,.1,1.4,.55,0x2a2a2d);bx(3.7,-.1,.1,1.4,.55,0x2a2a2d);
const sc=bx(3.28,-.2,.55,.9,.18,0x2a2a2d,.45);sc.rotation.x=.08;
const bs=new T.Mesh(new T.CylinderGeometry(.24,.17,.28,20),M(0xf2f4f6,{roughness:.3}));bs.position.set(3.28,.78,.62);bs.castShadow=true;S.add(bs);bx(3.28,.5,.4,.4,.7,0xdfe3e6);
// meja kantor
bx(-2.98,1.45,.55,1.2,.04,0x2a2a2d,.73);bx(-2.98,.95,.5,.04,.73,0x2a2a2d);bx(-2.98,1.95,.5,.04,.73,0x2a2a2d);
bx(-3.1,1.35,.04,.34,.26,0x1b1b1d,.8);bx(-3.1,1.35,.18,.1,.04,0x1b1b1d,.77,0,false);
// orang
const A=[];
function person(o){const g=new T.Group(),u=g.u={};
 const sk=M(o.sk||0xd6a07a),sh=M(o.sh||0x50565e),pn=M(o.pn||0x23262b),hr=M(o.hr||0x1b1511),hip=o.seat||.86;
 const mk=(geo,m,x,y,z,par)=>{const k=new T.Mesh(geo,m);k.position.set(x,y,z);k.castShadow=true;(par||g).add(k);return k};
 const B=(w,h,d)=>new T.BoxGeometry(w,h,d);
 mk(B(.4,.58,.22),sh,0,hip+.3,0);mk(B(.07,.08,.07),sk,0,hip+.64,0);
 mk(new T.SphereGeometry(.115,16,12),sk,0,hip+.76,.01);mk(new T.SphereGeometry(.122,16,12),hr,0,hip+.79,-.02).scale.set(1,.85,1);
 [-1,1].forEach((s,i)=>{
  const leg=new T.Group();leg.position.set(s*.1,hip,0);g.add(leg);
  if(o.seat){mk(B(.14,.14,.46),pn,0,0,.22,leg);mk(B(.13,.5,.13),pn,0,-.25,.45,leg);mk(B(.13,.07,.24),M(0x111111),0,-.52,.52,leg)}
  else{mk(B(.14,.84,.15),pn,0,-.42,0,leg);mk(B(.14,.07,.26),M(0x111111),0,-.84,.05,leg)}
  u[i?'rl':'ll']=leg;
  const arm=new T.Group();arm.position.set(s*.26,hip+.52,0);g.add(arm);
  mk(B(.09,.5,.09),sh,0,-.25,0,arm);mk(new T.SphereGeometry(.05,8,8),sk,0,-.54,0,arm);u[i?'ra':'la']=arm});
 if(o.cape)mk(new T.CylinderGeometry(.2,.36,.8,18),M(o.cape),0,hip+.1,.04);
 return g}
function put(p,x,z,ry,y){p.position.set(x,y||0,z);p.rotation.y=ry;S.add(p);return p}
const SK=[0xd6a07a,0xb9805a,0x8d5a3c,0xe8bf9c,0x6f4a32];
// tukang cukur
[[-2.44,0x2d3b55],[-.5,0x2d3b55]].forEach((b,i)=>{const p=put(person({sh:0x2b2f36,pn:0x15171b,sk:SK[i]}),b[0],-1.12,Math.PI);
 A.push(t=>{p.u.ra.rotation.x=-1.45+Math.sin(t*9+i*2)*.22;p.u.la.rotation.x=-1.15+Math.sin(t*3+i)*.08;p.rotation.y=Math.PI+Math.sin(t*.7+i)*.08})});
// pelanggan di kursi
[[-2.44,0xe8e8ea,3,0x3b7ea1],[-.5,0x2a2a2d,4,0xb04a4a]].forEach((c,i)=>{const p=put(person({seat:.62,sh:c[3],pn:0x394152,sk:SK[c[2]],hr:0x241a14,cape:c[1]}),c[0],-1.75,Math.PI);
 A.push(t=>{p.u.la.rotation.x=0;p.rotation.y=Math.PI+Math.sin(t*.5+i)*.05})});
// keramas
const lw=new T.Group(),li=person({sh:0x7a6a9a,pn:0x2c3340,sk:SK[1]});li.rotation.y=Math.PI;lw.add(li);lw.rotation.x=Math.PI/2;lw.position.set(3.28,.66,-1.0);S.add(lw);
const st=put(person({sh:0x2b2f36,pn:0x15171b,sk:SK[2]}),2.45,.55,Math.PI/2);
A.push(t=>{st.u.ra.rotation.x=-1.0+Math.sin(t*5)*.2;st.u.la.rotation.x=-1.0+Math.sin(t*5+1.5)*.2});
// ruang tunggu
[[2.0,SK[3],0x5a7a52,1],[2.95,SK[0],0xa8553a,0]].forEach((w,i)=>{const p=put(person({seat:.5,sh:w[2],pn:0x2b3a52,sk:w[1],hr:i?0x4a2e1c:0x1b1511}),w[0],2.2,Math.PI);
 A.push(t=>{if(w[3]){p.u.ra.rotation.x=-1.1;p.u.la.rotation.x=-1.0;p.rotation.y=Math.PI}else{p.u.ra.rotation.x=-.35;p.u.la.rotation.x=-.9+Math.sin(t*.6)*.1;p.rotation.y=Math.PI+Math.sin(t*.4)*.18}})});
// kantor
const of=put(person({seat:.5,sh:0x3d6b4f,pn:0x22262c,sk:SK[0]}),-3.44,1.5,Math.PI/2);
A.push(t=>{of.u.ra.rotation.x=-1.05+Math.sin(t*7)*.05;of.u.la.rotation.x=-1.05+Math.sin(t*7+2)*.05});
bx(-3.44,1.5,.5,.5,.06,0x222222,.46);bx(-3.62,1.5,.08,.5,.55,0x222222,.5);
// pejalan
function walker(p,pts,sp){let L=0;const sg=pts.map((a,i)=>{const b=pts[(i+1)%pts.length];const l=Math.hypot(b[0]-a[0],b[1]-a[1]);L+=l;return[a,b,l]});S.add(p);
 A.push(t=>{let s=(t*sp)%L,i=0;while(s>sg[i][2]){s-=sg[i][2];i++}const a=sg[i][0],b=sg[i][1],f=s/sg[i][2];
  p.position.set(a[0]+(b[0]-a[0])*f,0,a[1]+(b[1]-a[1])*f);p.rotation.y=Math.atan2(b[0]-a[0],b[1]-a[1]);
  const w=Math.sin(t*sp*5.5)*.55;p.u.ll.rotation.x=w;p.u.rl.rotation.x=-w;p.u.la.rotation.x=-w*.8;p.u.ra.rotation.x=w*.8})}
walker(person({sh:0xc2873a,pn:0x2a3140,sk:SK[4],hr:0x0f0c0a}),[[.3,5.2],[.3,2.2],[.3,.7],[-1.4,.1],[.3,.7],[.3,2.2]],.85);
walker(person({sh:0xf1f1f1,pn:0x15171b,sk:SK[2]}),[[-2.44,-.55],[.5,-.55],[2.2,-.1],[.5,-.55]],.7);
walker(person({sh:0x6b2f3a,pn:0x2c2f36,sk:SK[3],hr:0x3a2a1a}),[[-1.2,5.6],[-1.2,3.4],[.3,2.4],[1.6,.9],[.3,2.4],[-1.2,3.4]],.8);
// kamera
const V=[
 ['Masuk dari pintu',[.3,1.55,5.2],[.3,1.15,-1],0],
 ['Area tunggu',[-.2,1.6,.5],[2.6,.7,2.2],0],
 ['Stasiun cukur',[.1,1.6,1.7],[-.4,1,-2.2],1],
 ['Kursi dari dekat',[-1.4,1.3,-.2],[-.9,.95,-1.8],0],
 ['Area keramas',[1.6,1.75,-.9],[3.3,.7,-.1],0],
 ['Ruang kantor',[-2.4,1.9,2.5],[-3.3,.8,1.4],0],
 ['Pandangan pelanggan',[2.9,1.15,2.05],[-.3,1.1,-2.2],0],
 ['Dari pojok belakang',[-3.7,2.4,-2.5],[1.2,.6,1.6],0],

const look=new T.Vector3(...V[0][2]);C.position.set(...V[0][1]);

V.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v[0];b.onclick=()=>{auto=false;tg.classList.remove('on');go(i)};bar.appendChild(b)});

go(0);
let dr=null;const cv=R.domElement;
cv.addEventListener('pointerdown',e=>{dr=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',()=>dr=null);
cv.addEventListener('pointermove',e=>{if(!dr)return;yaw+=(e.clientX-dr[0])*.004;pit=Math.max(-.9,Math.min(.9,pit+(e.clientY-dr[1])*.004));dr=[e.clientX,e.clientY]});

addEventListener('resize',size);size();
const tp=new T.Vector3(),tl=new T.Vector3();
function frame(ms){requestAnimationFrame(frame);const t=ms/1000,dt=Math.min(.05,t-last);last=t;
 if(auto&&t>nextAt){go((cur+1)%V.length);nextAt=t+7}
 const v=V[cur];tp.set(...v[1]);tl.set(...v[2]);
 if(v[3]){const d=tp.clone().sub(tl);d.applyAxisAngle(UP,Math.sin(t*.22)*.4);tp.copy(tl).add(d)}

 const k=1-Math.exp(-dt*2.4);C.position.lerp(tp,k);look.lerp(tl,k);
 const d=look.clone().sub(C.position);d.applyAxisAngle(UP,-yaw);
 const rt=new T.Vector3().crossVectors(d,UP).normalize();d.applyAxisAngle(rt,-pit);
 C.lookAt(C.position.clone().add(d));
 A.forEach(f=>f(t));R.render(S,C)}
requestAnimationFrame(frame);
